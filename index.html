/* ---- words (same rules as the main site's Easy mode) ---- */
function fmtP(n){if(n==null||!isFinite(n))return '—';const a=Math.abs(n),d=(a>=1||a===0)?2:Math.min(8,3+Math.ceil(-Math.log10(a)));

function whenUTC(ms){const d=new Date(ms),day=new Intl.DateTimeFormat('en-US',{month:'short',day:'2-digit',timeZone:'UTC'}).format(d),yr=d.getUTCFullYear(),

function model(D,A){const now=Date.now(),n=D.c.length-(D.forming?1:0),mk={},main=[],rows=[],T=D.timeframe,tr=D.trend,L=D.last;

  main.push(['Trend',(tr.at_least?dw+' since at least '+sd:N<=3?'Just turned '+dw+(N?' ('+N+(N>1?' candles':' candle')+' ago)':''):dw+' since '+sd)
   +(tr.flip!=null?' · '+(up?'DOWN on a close under ':'UP on a close over ')+fmtP(tr.flip):'')]);mk.Trend=up?'up':'dn'}
 const tN=D.t[n-1]*1000,mv=[];for(const [lab,k,u] of (EASY_WIN[T]||EASY_WIN['1D'])){const tb=back(tN,k,u);let j=n-2;while(j>=0&&D.t[j]*1000>tb)j--;
  if(j>=0&&D.c[j]){const p=(c/D.c[j]-1)*100;mv.push(lab+': '+(p>=0?'up ':'down ')+Math.abs(p).toFixed(1)+'% ('+size(p)+')');mk.Move=p>=0?'up':'dn'}}

function draw(){const cv=$('#cv');if(!cv||!D)return;const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;

 for(let i=0;i<n;){const d=D.dir[i];let j=i;while(j+1<n&&D.dir[j+1]===d)j++;

   g.fillStyle=d===1?C('--up'):C('--dn');g.fillRect(x0,H-padB,x1-x0,3)}i=j+1}
 // grid + price labels
 g.font='11px '+C('--mono');g.textBaseline='middle';g.textAlign='left';
 for(let k=0;k<=4;k++){const v=lo+(hi-lo)*(k+.5)/5,y=Y(v);g.strokeStyle='#1b1a22';g.lineWidth=1;g.beginPath();g.moveTo(0,y);g.lineTo(W-padR+4,y);g.stroke();if(Math.abs(y-Y(D.c[n-1]))>14){g.fillStyle=C('--quiet');g.fillText(fmtP(v),W-padR+8,y)}}
 // date labels
 g.textAlign='center';g.textBaseline='alphabetic';g.fillStyle=C('--quiet');const step=Math.max(1,Math.ceil(n/Math.max(2,Math.floor((W-padR)/110))));
 for(let i=0;i<n;i+=step){const d=new Date(D.t[i]*1000);const lab=new Intl.DateTimeFormat('en-US',D.timeframe==='1M'||D.timeframe==='1W'?{month:'short',year:'2-digit',timeZone:'UTC'}:{month:'short',day:'numeric',timeZone:'UTC'}).format(d),lw=g.measureText(lab).width/2;
  g.fillText(lab,Math.max(lw+2,Math.min(W-padR-lw,X(i))),H-6)}
 // price line

 // last price
 const lc=D.c[n-1],ly=Y(lc);g.fillStyle=C('--line');g.fillRect(W-padR+2,ly-9,padR-4,18);g.fillStyle='#0c0b10';g.textAlign='left';g.textBaseline='middle';g.fillText(fmtP(lc),W-padR+6,ly);
 // marks
 for(const [i,k] of D.marks){const x=X(i),y=Y(D.c[i]),buy=k==='buy',col=C(buy?'--buy':'--sell'),yy=buy?y+16:y-16;
  g.strokeStyle=col;g.globalAlpha=.6;g.lineWidth=1;g.beginPath();g.moveTo(x,y);g.lineTo(x,yy);g.stroke();g.globalAlpha=1;

 // the next-smaller timeframe's buys: hollow orange rings under the line (secondary; never a solid dot)
 if(SUB&&D.sub&&D.sub.length){const tc=C('--neon-mari'),seen=new Set();g.lineWidth=2;g.strokeStyle=tc;
  for(const [j] of D.sub){if(seen.has(j)||j>=n)continue;seen.add(j);const x=X(j),y=Y(D.c[j])+(D.marks.some(z=>z[0]===j&&z[1]==='buy')?32:16);g.beginPath();g.arc(x,y,4.5,0,7);g.stroke()}}
 cv._geo={X,Y,n,W,padR}}

function hover(ev){const cv=$('#cv'),tip=$('#tip');if(!cv||!cv._geo)return;const r=cv.getBoundingClientRect(),x=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left,{X,n,W,padR}=cv._geo;
 if(x<0||x>W-padR){tip.style.display='none';return}let i=Math.round((x-6)/((W-padR-12)/Math.max(1,n-1)));i=Math.max(0,Math.min(n-1,i));
 const m=D.marks.find(z=>z[0]===i),d=D.dir[i];tip.innerHTML=`${whenUTC(D.t[i]*1000)}<br>${fmtP(D.c[i])} ${esc(D.quote)}${d?`<br>S-Trend ${d===1?'UP':'DOWN'}`:''}${m?`<br><b style="color:var(--${m[1]})">${m[1].toUpperCase()}</b>`:''}${(()=>{const k=SUB&&D.sub?D.sub.filter(z=>z[0]===i).length:0;return k?`<br><span style="color:var(--neon-mari)">${TFW[D.sub_tf]} buy${k>1?' ×'+k:''}</span>`:''})()}${i===n-1&&D.forming?'<br>still forming':''}`;
 tip.style.display='block';const tw=tip.offsetWidth;tip.style.left=Math.max(4,Math.min(W-tw-4,X(i)+12))+'px';tip.style.top='8px'}

/* ---- loading ---- */
function load(sym,tf,push){const e=IDX.symbols[sym];if(!e)return;if(!e.tfs[tf])tf=e.tfs['1D']?'1D':TFS.find(t=>e.tfs[t]);SYM=sym;TF=tf;store.set('sf.sym',sym);store.set('sf.tf',tf);
 if(push)history.replaceState(null,'','#'+sym+'/'+tf);renderPicker();renderTfs();
 fetch('data/'+sym+'_'+tf+'.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{if(sym!==SYM||tf!==TF)return;D=d;render()})
  .catch(()=>{$('#main').innerHTML='<p class="err">That chart could not be loaded. Try again in a minute.</p>'})}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-sym],[data-tf]');if(!b)return;if(window.cancelAutoTour)window.cancelAutoTour();if(b.dataset.sym){load(b.dataset.sym,TF,true);apClose()}else load(SYM,b.dataset.tf,true)});
document.addEventListener('mousemove',ev=>{if(ev.target.id==='cv')hover(ev);else if($('#tip'))$('#tip').style.display='none'});
document.addEventListener('touchstart',ev=>{if(ev.target.id==='cv')hover(ev)},{passive:true});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(draw,120)});
fetch('data/index.json',{cache:'no-cache'}).then(r=>r.json()).then(j=>{IDX=j;const h=location.hash.slice(1).split('/'),syms=Object.keys(j.symbols);
 const sym=j.symbols[h[0]]?h[0]:j.symbols[store.get('sf.sym')]?store.get('sf.sym'):(j.symbols.BTC?'BTC':syms[0]);load(sym,h[1]||store.get('sf.tf')||'1D',false)})
 .catch(()=>{$('#main').innerHTML='<p class="err">Could not load the data. Check your connection and try again.</p>'});
</script>
